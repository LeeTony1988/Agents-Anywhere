[package]
name = "aa-screen-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Agents Anywhere remote-desktop screen host (Windows-first). Speaks the HostControl NDJSON protocol over stdio."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }

[dependencies.livekit]
version = "=0.10.1"
optional = true

[features]
# Windows.Graphics.Capture (WGC) 真采集。当前为占位实现：枚举显示器为真实实现，
# 帧采集在启用本 feature 时仍返回 rd_capture_failed（TODO RD-P2-10）。
wgc = []
# LiveKit 发布。livekit = "=0.10.1"，需要联网构建 libwebrtc；默认关闭。
livekit = ["dep:livekit"]
