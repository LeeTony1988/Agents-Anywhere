[package]
name = "aa-screen-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Agents Anywhere remote-desktop screen host (Windows-first). Speaks the HostControl NDJSON protocol over stdio."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
jpeg-encoder = "0.6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
] }
windows-capture = { version = "2.0.1", optional = true }

[dependencies.livekit]
version = "=0.10.1"
optional = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "sync", "time"]
optional = true

[features]
# Windows.Graphics.Capture (WGC) 真采集。启用后使用 windows-capture 抓取真实
# BGRA 帧并在 host 内转 I420；默认关闭以保持非 Windows CI 轻量。
wgc = ["dep:windows-capture"]
# LiveKit 发布。livekit = "=0.10.1"，需要预编译 libwebrtc；默认关闭。
livekit = ["dep:livekit", "dep:tokio"]
