name: agents-anywhere

services:
  postgres-next:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents_anywhere
      POSTGRES_USER: agents_anywhere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agents_anywhere_dev_password}
    volumes:
      - agents-anywhere-pg-next:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents_anywhere -d agents_anywhere"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-next:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - agents-anywhere-redis-next:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.9.0
    restart: unless-stopped
    profiles: ["remote-desktop"]
    command: ["--config", "/etc/livekit.yaml"]
    depends_on:
      redis-next:
        condition: service_healthy
    environment:
      LIVEKIT_API_SECRET: ${AGENT_SERVER_LIVEKIT_API_SECRET:-change-me-livekit-secret}
      LIVEKIT_TURN_DOMAIN: ${AGENT_SERVER_LIVEKIT_TURN_DOMAIN:-turn.example.com}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - ${AGENT_SERVER_LIVEKIT_TURN_CERT:-../.local-dev/turn.crt}:/etc/livekit/turn.crt:ro
      - ${AGENT_SERVER_LIVEKIT_TURN_KEY:-../.local-dev/turn.key}:/etc/livekit/turn.key:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
      - "5349:5349"
      - "3478:3478/udp"
      - "6789:6789"

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    # Opt-in: enable with `--profile monitoring` after turning the Server's
    # metrics endpoint on, so the default deployment exposes nothing extra.
    profiles: ["monitoring"]
    depends_on:
      - livekit
      - server-next
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      # Write the scrape token next to the compose file; the Server only checks
      # it when AGENT_SERVER_METRICS_TOKEN is set.
      - ${AGENT_SERVER_METRICS_TOKEN_FILE:-../.local-dev/metrics-token}:/etc/prometheus/metrics-token:ro
    ports:
      - "9090:9090"

  migrate-next:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: server
    image: agents-anywhere-server:postgres
    depends_on:
      postgres-next:
        condition: service_healthy
    environment:
      AGENT_SERVER_DB_URL: postgresql+asyncpg://agents_anywhere:${POSTGRES_PASSWORD:-agents_anywhere_dev_password}@postgres-next:5432/agents_anywhere
      AGENT_SERVER_MIGRATION_LOCK_TIMEOUT: ${AGENT_SERVER_MIGRATION_LOCK_TIMEOUT:-120}
    command: ["sh", "-c", "cd /app/server && uv run --no-sync python -m agent_server.infra.db.migrations upgrade"]

  server-next:
    image: agents-anywhere-server:postgres
    restart: unless-stopped
    depends_on:
      migrate-next:
        condition: service_completed_successfully
      redis-next:
        condition: service_healthy
    environment:
      AGENT_SERVER_DB_URL: postgresql+asyncpg://agents_anywhere:${POSTGRES_PASSWORD:-agents_anywhere_dev_password}@postgres-next:5432/agents_anywhere
      AGENT_SERVER_DB_POOL_SIZE: ${AGENT_SERVER_DB_POOL_SIZE:-10}
      AGENT_SERVER_DB_MAX_OVERFLOW: ${AGENT_SERVER_DB_MAX_OVERFLOW:-20}
      AGENT_SERVER_DB_POOL_TIMEOUT: ${AGENT_SERVER_DB_POOL_TIMEOUT:-30}
      AGENT_SERVER_DB_POOL_RECYCLE: ${AGENT_SERVER_DB_POOL_RECYCLE:-1800}
      AGENT_SERVER_REDIS_URL: redis://redis-next:6379/0
      AGENT_SERVER_REDIS_CONNECT_TIMEOUT: ${AGENT_SERVER_REDIS_CONNECT_TIMEOUT:-5}
      AGENT_SERVER_TIMELINE_REVISION_LEASE_SIZE: ${AGENT_SERVER_TIMELINE_REVISION_LEASE_SIZE:-4096}
      AGENT_SERVER_FILES_BACKEND: local
      AGENT_SERVER_FILES_LOCAL_ROOT: /data/agent-server.files
      AGENT_SERVER_SECRET: ${AGENT_SERVER_SECRET:-change-me-before-production}
      AGENT_SERVER_PUBLIC_ORIGIN: ${AGENT_SERVER_PUBLIC_ORIGIN:-}
      AGENT_SERVER_CORS_ORIGINS: ${AGENT_SERVER_CORS_ORIGINS:-http://127.0.0.1:${AGENTS_ANYWHERE_WEB_PORT:-5174},http://localhost:${AGENTS_ANYWHERE_WEB_PORT:-5174}}
      AGENT_SERVER_REMOTE_DESKTOP_ENABLED: ${AGENT_SERVER_REMOTE_DESKTOP_ENABLED:-false}
      AGENT_SERVER_LIVEKIT_URL: ${AGENT_SERVER_LIVEKIT_URL:-}
      AGENT_SERVER_LIVEKIT_API_KEY: ${AGENT_SERVER_LIVEKIT_API_KEY:-aa_remote_desktop}
      AGENT_SERVER_LIVEKIT_API_SECRET: ${AGENT_SERVER_LIVEKIT_API_SECRET:-}
      AGENT_SERVER_METRICS_ENABLED: ${AGENT_SERVER_METRICS_ENABLED:-false}
      AGENT_SERVER_METRICS_TOKEN: ${AGENT_SERVER_METRICS_TOKEN:-}
    volumes:
      - agents-anywhere-files-next:/data
    ports:
      - "${AGENTS_ANYWHERE_WEB_PORT:-5174}:8000"

volumes:
  agents-anywhere-pg-next:
  agents-anywhere-redis-next:
  agents-anywhere-files-next:
