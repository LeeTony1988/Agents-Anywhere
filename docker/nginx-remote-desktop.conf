# Reverse proxy for Agents Anywhere with remote desktop.
#
# Copy next to docker-compose.postgres.yml and mount into nginx:
#   -v ./nginx-remote-desktop.conf:/etc/nginx/conf.d/default.conf:ro
#
# What matters for remote desktop:
#   * the session WebSocket needs Upgrade/Connection headers and a read timeout
#     longer than the 90 s resume window;
#   * the LiveKit webhook body must reach the Server byte-for-byte (the Server
#     verifies a sha256 claim over the raw body), so no gzip/rewrite;
#   * screenshot requests carry a base64 image, so the body limit has to be
#     larger than the Server default;
#   * media never goes through this proxy: LiveKit listens on 7880/7881/udp.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream agents_anywhere_server {
    server server-next:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    # Session event stream (SSE) and remote desktop control WebSocket.
    location ~ ^/api/v2/(remote-desktop/sessions/[^/]+/ws|sessions/[^/]+/events|dashboard/stream)$ {
        proxy_pass http://agents_anywhere_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # LiveKit calls this; the body is signed, so pass it through untouched.
    location = /api/v2/internal/livekit/webhook {
        proxy_pass http://agents_anywhere_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering on;
        proxy_set_header Accept-Encoding "";
        gzip off;
    }

    location / {
        proxy_pass http://agents_anywhere_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
